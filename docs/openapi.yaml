openapi: 3.0.3
info:
  title: API Sistem RKAP (DIA CAPEX) CN dan CNH
  version: 1.0.0
  description: |
    Spesifikasi resmi Kontrak API Sistem Rencana Kerja dan Anggaran Perusahaan (RKAP)
    berbasis DIA CAPEX untuk PT Cipta Nirmala (CN) dan PT Cipta Nirmala Husada (CNH).
    Dokumen ini dihasilkan langsung dari kode sumber backend dan menjadi sumber kebenaran resmi kontrak API.
servers:
  - url: "http://localhost:5000/api"
    description: Lingkungan Pengembangan Lokal
  - url: "https://rkap.ciptanirmala.com/api"
    description: Lingkungan Produksi
tags:
  - name: Auth & Profil
    description: Autentikasi sesi cookie, token CSRF, dan manajemen kata sandi
  - name: Manajemen Pengguna
    description: Pengelolaan akun pengguna, peran, dan wewenang akses unit
  - name: Master Barang & Harga
    description: Master barang logistik, penetapan harga per perusahaan, dan impor Excel
  - name: Master COA & Kelompok
    description: Bagan akun standar (COA), kategori biaya, dan kelompok akun
  - name: Master Unit & Organisasi
    description: Unit kerja, kelompok organisasi, alias unit, dan data referensi
  - name: Kategori & Prioritas Investasi
    description: Master kategori belanja modal, masa manfaat, akun susut, dan skala prioritas
  - name: Periode & Akses Pengajuan
    description: Pengaturan siklus anggaran tahunan dan pembukaan/penutupan akses unit
  - name: Dokumen & Entry Biaya
    description: Penyusunan anggaran biaya operasional (OPEX) dan rincian kuantitas bulanan
  - name: Permintaan Barang Baru
    description: Pengajuan barang non-master oleh PIC dan penetapan COA oleh Akuntansi
  - name: Entry Anggaran Investasi
    description: Penyusunan belanja modal (CAPEX), kalkulasi penyusutan, dan justifikasi strategis
  - name: Alur Persetujuan (Workflow)
    description: Pengajuan (submit), persetujuan berjenjang, pengembalian, dan finalisasi anggaran
  - name: Realisasi Jurnal Buku Besar
    description: "Unggah buku besar ERP (xlsx), pemetaan unit [9xxx], dan agregasi realisasi"
  - name: Dashboard Monitoring
    description: Ringkasan capaian realisasi, progres pengisian, dan status ambang pemakaian
  - name: Laporan & Ekspor
    description: Rekapitulasi anggaran, matriks unit x COA format ERP, dan ekspor lembar sebar
  - name: Notifikasi
    description: Notifikasi in-app dan pelacak batas waktu siklus anggaran
  - name: Pengaturan Sistem
    description: Parameter ambang investasi, toleransi peringatan, dan konfigurasi global
  - name: Jejak Audit
    description: Log riwayat seluruh mutasi data untuk audit kepatuhan dan tata kelola
  - name: Health & Dokumentasi
    description: Pemeriksaan status server, koneksi database, dan spesifikasi OpenAPI
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Cookie sesi httpOnly yang diterbitkan saat login berhasil
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token CSRF yang wajib disertakan pada seluruh request mutasi (POST, PUT, PATCH, DELETE)
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Pesan galat berbahasa Indonesia
        code:
          type: string
          example: VALIDATION_ERROR
        errors:
          type: array
          items:
            type: object
    MetaPagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        total_pages:
          type: integer
          example: 4
paths:
  /auth/csrf:
    get:
      tags:
        - "Auth & Profil"
      summary: Dapatkan Token CSRF
      description: Menghasilkan token CSRF untuk header X-CSRF-Token pada seluruh request mutasi data.
      responses:
        200:
          description: Berhasil mendapatkan token CSRF
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
  /auth/login:
    post:
      tags:
        - "Auth & Profil"
      summary: Login Pengguna
      description: Autentikasi pengguna menggunakan email dan kata sandi dengan sesi cookie httpOnly.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - "email"
                - "password"
              properties:
                email:
                  type: string
                  format: email
                  example: rina@ptcn.id
                password:
                  type: string
                  example: password123
      responses:
        200:
          description: Login berhasil, cookie sesi diterbitkan
        401:
          description: Email atau kata sandi tidak valid
        429:
          description: Terlalu banyak percobaan login, coba lagi nanti
  /auth/logout:
    post:
      tags:
        - "Auth & Profil"
      summary: Logout Pengguna
      description: Mengakhiri sesi pengguna aktif dan menghapus cookie sesi.
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        200:
          description: Logout berhasil
        401:
          description: Sesi tidak valid
  /auth/me:
    get:
      tags:
        - "Auth & Profil"
      summary: Profil Pengguna Aktif
      description: Mendapatkan data pengguna yang sedang login beserta peran dan daftar unit yang ditugaskan.
      security:
        - cookieAuth: []
      responses:
        200:
          description: Profil pengguna terautentikasi
        401:
          description: Belum login
  /auth/password:
    put:
      tags:
        - "Auth & Profil"
      summary: Ubah Kata Sandi Mandiri
      description: Mengubah kata sandi pengguna sendiri dan mencabut sesi di perangkat lain.
      security:
        - cookieAuth: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - "current_password"
                - "new_password"
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 6
      responses:
        200:
          description: Kata sandi berhasil diubah
        400:
          description: Kata sandi lama tidak cocok
        422:
          description: Validasi kata sandi baru gagal
  /users:
    get:
      tags:
        - "Manajemen Pengguna"
      summary: Daftar Pengguna
      description: Mendapatkan daftar seluruh akun pengguna dengan filter peran, pencarian, dan paginasi.
      security:
        - cookieAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum:
              - "pic"
              - "manager"
              - "akuntansi"
        - name: search
          in: query
          schema:
            type: string
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
      responses:
        200:
          description: "Daftar pengguna terpaginasi format { data, meta }"
    post:
      tags:
        - "Manajemen Pengguna"
      summary: Tambah Pengguna Baru
      description: Membuat akun pengguna baru dan menetapkan unit awal (khusus Akuntansi).
      security:
        - cookieAuth: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - "name"
                - "email"
                - "password"
                - "role"
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                role:
                  type: string
                  enum:
                    - "pic"
                    - "manager"
                    - "akuntansi"
                unit_ids:
                  type: array
                  items:
                    type: integer
      responses:
        201:
          description: Pengguna berhasil dibuat
        422:
          description: Email sudah terdaftar atau input tidak valid
  /users/{id}:
    get:
      tags:
        - "Manajemen Pengguna"
      summary: Detail Pengguna
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Detail profil pengguna beserta unit
        404:
          description: Pengguna tidak ditemukan
    put:
      tags:
        - "Manajemen Pengguna"
      summary: Perbarui Informasi Pengguna
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Pengguna berhasil diperbarui
        403:
          description: Dilarang menurunkan role akun Akuntansi aktif terakhir
  /users/{id}/status:
    patch:
      tags:
        - "Manajemen Pengguna"
      summary: Aktif/Nonaktifkan Pengguna
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Status pengguna berhasil diperbarui
        403:
          description: Dilarang menonaktifkan diri sendiri atau Akuntansi terakhir
  /users/{id}/units:
    put:
      tags:
        - "Manajemen Pengguna"
      summary: Atur Penugasan Unit Kerja
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Daftar penugasan unit berhasil diperbarui
  /users/{id}/reset-password:
    post:
      tags:
        - "Manajemen Pengguna"
      summary: Reset Kata Sandi Pengguna (Admin)
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Kata sandi berhasil direset dan sesi lama dicabut
  /items:
    get:
      tags:
        - "Master Barang & Harga"
      summary: Daftar Barang Logistik
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: coa_id
          in: query
          schema:
            type: integer
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: available_for_doc
          in: query
          schema:
            type: integer
          description: Kecualikan barang yang sudah masuk dokumen ini
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: "Daftar barang terpaginasi format { data, meta }"
    post:
      tags:
        - "Master Barang & Harga"
      summary: Tambah Barang Baru
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        201:
          description: Barang berhasil ditambahkan
  /items/{id}:
    get:
      tags:
        - "Master Barang & Harga"
      summary: Detail Barang
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Detail barang beserta harga
    put:
      tags:
        - "Master Barang & Harga"
      summary: Perbarui Barang
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Barang berhasil diperbarui
    delete:
      tags:
        - "Master Barang & Harga"
      summary: Hapus Barang Permanen
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Barang berhasil dihapus
        409:
          description: Barang tidak dapat dihapus karena sudah digunakan di dokumen
  /items/{id}/prices:
    patch:
      tags:
        - "Master Barang & Harga"
      summary: Perbarui Harga Master Barang
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Harga barang diperbarui dan dicatat ke riwayat
  /items/{id}/status:
    patch:
      tags:
        - "Master Barang & Harga"
      summary: Ubah Status Aktif Barang
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Status berhasil diperbarui
  /items/import:
    post:
      tags:
        - "Master Barang & Harga"
      summary: Impor Master Barang Excel
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: dry_run
          in: query
          schema:
            type: boolean
            default: false
        - name: company_code
          in: query
          schema:
            type: string
            default: CN
        - name: update_prices
          in: query
          schema:
            type: boolean
            default: false
      responses:
        200:
          description: Hasil impor barang atau ringkasan simulasi dry-run
  /items/quality-report:
    get:
      tags:
        - "Master Barang & Harga"
      summary: Laporan Kualitas Data Master Barang
      security:
        - cookieAuth: []
      responses:
        200:
          description: Metrik barang tanpa harga, tanpa COA, dan ringkasan impor
  /items/{id}/price-history:
    get:
      tags:
        - "Master Barang & Harga"
      summary: Riwayat Perubahan Harga Barang
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Jejak riwayat perubahan harga per perusahaan
  /coas:
    get:
      tags:
        - "Master COA & Kelompok"
      summary: Daftar Bagan Akun (COA)
      security:
        - cookieAuth: []
      responses:
        200:
          description: "Daftar COA terpaginasi format { data, meta }"
    post:
      tags:
        - "Master COA & Kelompok"
      summary: Tambah Akun COA Baru
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        201:
          description: COA berhasil ditambahkan
  /coas/{id}:
    get:
      tags:
        - "Master COA & Kelompok"
      summary: Detail Akun COA
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Detail COA
    put:
      tags:
        - "Master COA & Kelompok"
      summary: Perbarui Akun COA
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: COA berhasil diperbarui
    delete:
      tags:
        - "Master COA & Kelompok"
      summary: Hapus Akun COA
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: COA berhasil dihapus
        409:
          description: COA masih digunakan
  /coa-groups:
    get:
      tags:
        - "Master COA & Kelompok"
      summary: Daftar Kelompok Akun COA
      security:
        - cookieAuth: []
      responses:
        200:
          description: "Daftar kelompok akun format { data, meta }"
  /coas/import:
    post:
      tags:
        - "Master COA & Kelompok"
      summary: Impor Master COA Multi-Sheet Excel
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        200:
          description: Hasil impor 3 sheet master COA
  /units:
    get:
      tags:
        - "Master Unit & Organisasi"
      summary: Daftar Unit Kerja
      security:
        - cookieAuth: []
      responses:
        200:
          description: "Daftar unit kerja format { data, meta }"
    post:
      tags:
        - "Master Unit & Organisasi"
      summary: Tambah Unit Kerja Baru
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        201:
          description: Unit berhasil ditambahkan
  /units/{id}:
    put:
      tags:
        - "Master Unit & Organisasi"
      summary: Perbarui Unit Kerja
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Unit berhasil diperbarui
    delete:
      tags:
        - "Master Unit & Organisasi"
      summary: Hapus Unit Kerja
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Unit berhasil dihapus
        409:
          description: Unit masih digunakan
  /units/import:
    post:
      tags:
        - "Master Unit & Organisasi"
      summary: Impor Draf Master Unit Excel
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        200:
          description: Hasil impor unit kerja dengan opsi dry-run
  /reference-data:
    get:
      tags:
        - "Master Unit & Organisasi"
      summary: Data Referensi Master Global
      description: Mengambil data master statis perusahaan dan kelompok organisasi secara terpadu.
      security:
        - cookieAuth: []
      responses:
        200:
          description: Data referensi perusahaan dan org_groups
  /unit-aliases:
    get:
      tags:
        - "Master Unit & Organisasi"
      summary: "Daftar Alias Unit [9xxx]"
      security:
        - cookieAuth: []
      responses:
        200:
          description: Pemetaan alias kode unit buku besar ke unit resmi
    put:
      tags:
        - "Master Unit & Organisasi"
      summary: Petakan Alias Unit Kerja
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        200:
          description: Alias unit berhasil diperbarui
  /investment-categories:
    get:
      tags:
        - "Kategori & Prioritas Investasi"
      summary: Daftar Kategori Belanja Modal (Investasi)
      security:
        - cookieAuth: []
      responses:
        200:
          description: "Daftar kategori belanja modal format { data, meta }"
  /investment-categories/{id}:
    put:
      tags:
        - "Kategori & Prioritas Investasi"
      summary: Perbarui Masa Manfaat & COA Penyusutan Kategori Investasi
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Kategori belanja modal berhasil diperbarui
  /priorities:
    get:
      tags:
        - "Kategori & Prioritas Investasi"
      summary: Daftar Skala Prioritas Investasi
      security:
        - cookieAuth: []
      responses:
        200:
          description: "Skala prioritas format { success, data, meta }"
  /periods:
    get:
      tags:
        - "Periode & Akses Pengajuan"
      summary: Daftar Periode Anggaran RKAP
      security:
        - cookieAuth: []
      responses:
        200:
          description: Daftar periode anggaran (Array)
    post:
      tags:
        - "Periode & Akses Pengajuan"
      summary: Buat Periode Anggaran Baru
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        201:
          description: Periode berhasil dibuat
        409:
          description: Periode tahun tersebut sudah ada
  /periods/{id}:
    put:
      tags:
        - "Periode & Akses Pengajuan"
      summary: Perbarui Jadwal & Batas Waktu Periode
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Batas waktu berhasil diperbarui
  /periods/{id}/submission:
    patch:
      tags:
        - "Periode & Akses Pengajuan"
      summary: Buka / Tutup Pengajuan Level Periode
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Status pengajuan level periode berhasil diubah
  /periods/{id}/submission/bulk:
    post:
      tags:
        - "Periode & Akses Pengajuan"
      summary: Buka / Tutup Akses Pengajuan Massal
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Akses pengajuan massal berhasil diperbarui
  /budget-docs/{id}/access:
    get:
      tags:
        - "Periode & Akses Pengajuan"
      summary: Status Akses Efektif Dokumen Anggaran
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Evaluasi hierarkis status akses pengisian (isOpen, reason, source)
  /submission-access:
    get:
      tags:
        - "Periode & Akses Pengajuan"
      summary: Daftar Pengecualian Akses Unit
      security:
        - cookieAuth: []
      responses:
        200:
          description: Daftar override akses per unit dan jenis anggaran
    post:
      tags:
        - "Periode & Akses Pengajuan"
      summary: Buat Pengecualian Akses Unit Manual
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        201:
          description: Pengecualian berhasil disimpan
  /submission-access/{id}:
    put:
      tags:
        - "Periode & Akses Pengajuan"
      summary: Perbarui Status Pengecualian Akses Unit
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Pengecualian akses diperbarui
    delete:
      tags:
        - "Periode & Akses Pengajuan"
      summary: Hapus Pengecualian Akses Unit
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Pengecualian akses dihapus, kembali ke default periode
  /budget-docs:
    get:
      tags:
        - "Dokumen & Entry Biaya"
      summary: Daftar Dokumen Anggaran Unit
      security:
        - cookieAuth: []
